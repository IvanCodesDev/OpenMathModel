[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omm-agent-harness"
version = "0.1.0"
description = "Agent Harness：ModelGateway（Provider/路由/结构化输出/录制回放）、BudgetGovernor 四级预算、TraceHub 运行跟踪；httpx 等三方依赖隔离在 core 之外（设计文档 §3.1/§4）"
requires-python = ">=3.12"
dependencies = [
  "omm-agent-core",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["omm_agent_harness*"]

[tool.setuptools.package-data]
omm_agent_harness = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
