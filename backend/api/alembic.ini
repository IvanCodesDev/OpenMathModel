[alembic]
script_location = alembic
# NOTE: keep this file ASCII-only. Alembic/logging read it with the OS locale
# encoding (GBK on zh-CN Windows), so non-ASCII bytes break `alembic upgrade`.
# The URL is resolved by alembic/env.py from the OMM_DATABASE_URL environment
# variable; the placeholder below is intentionally left blank.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
