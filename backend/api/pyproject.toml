[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openmathmodel-api"
version = "0.1.0"
description = "OpenMathModel 控制面 API（FastAPI + SQLAlchemy 2 + Alembic）"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.5,<3",
  "pydantic-settings>=2.2",
  "bcrypt>=4.1,<5",
  "psycopg[binary]>=3.1,<4",
  "python-multipart>=0.0.9",
  # 附件正文抽取：OOXML/OpenDocument/压缩包/纯文本走标准库，PDF 必须有它
  "pypdf>=5",
  # 自定义模型接口的服务端出网调用（对话回复与任务执行共用）
  "httpx>=0.27",
  "omm-contracts",
  "omm-agent-core",
  # 六个建模阶段的真实 LLM 节点与提示词注册表
  "omm-agent-skills",
  # 实验阶段的 python 沙箱、工具注册表与调用记录器
  "omm-agent-tools",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "jsonschema>=4.21",
  "rfc3339-validator>=0.1.4",
]
# 旧版二进制 Office 与 RTF：缺这些包时接口如实返回 unsupported，不会报错
legacy-docs = [
  "olefile>=0.47",
  "xlrd>=2.0",
  "striprtf>=0.0.26",
]
# 图片 OCR：除这两个包外还需要系统里装有 Tesseract 可执行文件与对应语言包
ocr = [
  "pytesseract>=0.3.13",
  "pillow>=10",
]
# 扫描件 PDF 的远程 OCR 前置：远程 API（OpenAI 兼容协议）只收图片，PDF 需先
# 逐页渲染成图片再上送。图片附件本身零新增依赖（httpx 走核心依赖）；缺这两个
# 包时扫描件如实 empty 并说明启用途径，不会报错。
pdf-ocr = [
  "pypdfium2>=4",
  "pillow>=10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["omm_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
