[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openmathmodel-api"
version = "0.1.0"
description = "OpenMathModel 控制面 API（FastAPI + SQLAlchemy 2 + Alembic）"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.5,<3",
  "pydantic-settings>=2.2",
  "bcrypt>=4.1,<5",
  "psycopg[binary]>=3.1,<4",
  "python-multipart>=0.0.9",
  # 附件正文抽取：OOXML/OpenDocument/压缩包/纯文本走标准库，PDF 必须有它
  "pypdf>=5",
  "omm-contracts",
  "omm-agent-core",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "jsonschema>=4.21",
  "rfc3339-validator>=0.1.4",
]
# 旧版二进制 Office 与 RTF：缺这些包时接口如实返回 unsupported，不会报错
legacy-docs = [
  "olefile>=0.47",
  "xlrd>=2.0",
  "striprtf>=0.0.26",
]
# 图片 OCR：除这两个包外还需要系统里装有 Tesseract 可执行文件与对应语言包
ocr = [
  "pytesseract>=0.3.13",
  "pillow>=10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["omm_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
