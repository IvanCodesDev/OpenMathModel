[project]
name = "omm-contracts"
version = "0.1.0"
description = "OpenAPI、JSON Schema 与事件信封的跨语言事实来源（Python 侧生成物）"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omm_contracts"]
